<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">Registro de Categoría</h4>

          <form #f="ngForm" (ngSubmit)="registrarCategoria(f)">
            <!-- Nombre -->
            <div class="mb-3">
              <label for="categoryName" class="form-label fw-semibold"> Nombre </label>
              <input
                type="text"
                class="form-control"
                id="categoryName"
                name="categoryName"
                required
                [(ngModel)]="nuevaCategoria.categoryName"
                #categoryName="ngModel"
                [class.is-invalid]="categoryName.invalid && categoryName.touched"
                placeholder="Ingrese el nombre de la categoría"
              />
              <div class="invalid-feedback">Complete el campo</div>
            </div>

            <!-- Descripción -->
            <div class="mb-3">
              <label for="description" class="form-label fw-semibold"> Descripción </label>
              <textarea
                class="form-control"
                id="description"
                name="description"
                rows="3"
                required
                [(ngModel)]="nuevaCategoria.description"
                #description="ngModel"
                [class.is-invalid]="description.invalid && description.touched"
                placeholder="Ingrese una descripción"
              ></textarea>
              <div class="invalid-feedback">Complete el campo</div>
            </div>

            <!-- Botones -->
            <div class="d-flex justify-content-between mt-4">
              <button type="submit" class="btn btn-primary px-4" [disabled]="f.invalid">
                Guardar
              </button>

              <a routerLink="/listar-categorias" class="btn btn-outline-secondary px-4">
                Regresar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
