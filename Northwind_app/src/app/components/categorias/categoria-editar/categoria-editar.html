<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">Edición de Categoría</h4>

          <form #f="ngForm" (ngSubmit)="actualizarCategoria(f)">
            <!-- Id -->
            <div class="mb-3">
              <label for="categoryId" class="form-label fw-semibold"> Id </label>
              <input
                type="text"
                class="form-control bg-light"
                id="categoryId"
                name="categoryId"
                required
                readonly
                [(ngModel)]="actualizadaCategoria.categoryId"
                #categoryId="ngModel"
                [class.is-invalid]="categoryId.invalid && categoryId.touched"
              />
              <div class="invalid-feedback">Complete el campo</div>
            </div>

            <!-- Nombre -->
            <div class="mb-3">
              <label for="categoryName" class="form-label fw-semibold"> Nombre </label>
              <input
                type="text"
                class="form-control"
                id="categoryName"
                name="categoryName"
                required
                [(ngModel)]="actualizadaCategoria.categoryName"
                #categoryName="ngModel"
                [class.is-invalid]="categoryName.invalid && categoryName.touched"
                placeholder="Ingrese el nombre de la categoría"
              />
              <div class="invalid-feedback">Complete el campo</div>
            </div>

            <!-- Descripción -->
            <div class="mb-3">
              <label for="description" class="form-label fw-semibold"> Descripción </label>
              <textarea
                class="form-control"
                id="description"
                name="description"
                rows="3"
                required
                [(ngModel)]="actualizadaCategoria.description"
                #description="ngModel"
                [class.is-invalid]="description.invalid && description.touched"
                placeholder="Ingrese la descripción"
              ></textarea>
              <div class="invalid-feedback">Complete el campo</div>
            </div>

            <!-- Botones -->
            <div class="d-flex justify-content-between mt-4">
              <button type="submit" class="btn btn-primary px-4" [disabled]="f.invalid">
                Actualizar
              </button>

              <a routerLink="/categorias/listado" class="btn btn-outline-secondary px-4">
                Regresar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
